name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (offline tier only — no ML models)
        run: pip install -e ".[dev,api]"
      - name: Run full test suite (deselect real-model tests)
        run: pytest -m "not slow"
      - name: Run evaluation runner (deterministic offline tier)
        run: python -m paperdna.eval all --out /tmp/eval-report.json
      - name: Verify committed reports are reproducible
        run: |
          python -m paperdna.eval retrieval --split test --out /tmp/retrieval_test.json
          diff docs/evaluation/reports/retrieval_test.json /tmp/retrieval_test.json

  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
